<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FrameShot promo tile</title>
<style>
  @font-face { font-family: 'Inter'; src: url('./inter.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #fff; position: relative;
    background: radial-gradient(70% 90% at 0% 0%, #6d6af7 0%, transparent 60%),
                radial-gradient(60% 90% at 100% 100%, #d946ef 0%, transparent 55%),
                linear-gradient(135deg, #3730a3 0%, #5b21b6 55%, #9d174d 120%);
  }
  .grain { position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 4px 4px; opacity:.5; }
  .brand { display:flex; align-items:center; gap: .5em; font-weight: 700; letter-spacing: -.02em; }
  .brand img { width: 1.6em; height: 1.6em; border-radius: .42em; background: #fff; padding: .18em; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  h1 { font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
  .tags { display:flex; flex-wrap:wrap; gap:.45em; }
  .tags span { padding: .32em .75em; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); font-weight: 600; }
  .shot { position:absolute; border-radius: 14px; overflow:hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.18); background:#fff; }
  .shot .bar { height: 26px; background: #f3f4f8; display:flex; align-items:center; gap:7px; padding: 0 12px; }
  .shot .bar i { width: 10px; height: 10px; border-radius: 50%; display:block; }
  .shot img { display:block; width:100%; }
  /* small 440×280 */
  .small .wrap { position:absolute; inset: 22px 24px; display:flex; flex-direction:column; justify-content:space-between; z-index: 2; }
  .small .brand { font-size: 21px; }
  .small h1 { font-size: 31px; max-width: 290px; }
  .small .tags { font-size: 12px; }
  .small .shot { width: 300px; right: -128px; bottom: -84px; transform: rotate(-8deg); opacity: .96; }
  /* marquee 1400×560 */
  .marquee .wrap { position:absolute; left: 76px; top: 72px; width: 600px; z-index: 2; }
  .marquee .brand { font-size: 32px; }
  .marquee h1 { font-size: 56px; margin-top: 34px; white-space: nowrap; }
  .marquee p { font-size: 20px; line-height: 1.45; opacity: .92; margin-top: 20px; max-width: 540px; }
  .marquee .tags { font-size: 15px; margin-top: 28px; }
  .marquee .shot { width: 720px; right: -50px; top: 56px; transform: perspective(1600px) rotateY(-16deg) rotateX(4deg); }
  .marquee .shot2 { width: 340px; right: auto; left: 664px; top: 304px; z-index: 3; transform: perspective(1200px) rotateY(-8deg); }
</style>
</head>
<body>
  <div class="grain"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const w = Number(q.get('w') || 440);
    document.body.className = w >= 1000 ? 'marquee' : 'small';
    const marquee = w >= 1000;
    document.body.insertAdjacentHTML('beforeend', `
      <div class="wrap">
        <div class="brand"><img src="/logo.svg" alt="" />FrameShot</div>
        <div>
          <h1>${marquee ? 'Record your screen.<br/>Capture full pages.' : 'Screen recorder &amp; full page screenshots'}</h1>
          ${marquee ? '<p>Record a tab, window or screen with sound and camera. Capture, annotate and blur full-page screenshots. Everything stays on your device.</p>' : ''}
        </div>
        <div class="tags">${['Free', 'No watermark', 'Private', marquee ? 'MP4 · GIF · PNG · PDF' : ''].filter(Boolean).map((t) => `<span>${t}</span>`).join('')}</div>
      </div>
      <div class="shot"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><img src="../screenshots/02-full-page-editor.png" alt="" /></div>
      ${marquee ? '<div class="shot shot2"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><img src="../screenshots/01-screen-recorder.png" alt="" /></div>' : ''}
    `);
  </script>
</body>
</html>
