<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameShot showcase stage</title>
<style>
@font-face{font-family:Inter;src:url(../../store-assets/promo/inter.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07070f}
body{font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#090914}
.scene,.layerbox{position:absolute;inset:0}
.chip,.pill,.tall,.tag,.rec,.feat,.tile,.btn,.toast,.prog,.count,.tool,.scan,.card{left:0;top:0}
.abs{position:absolute;left:0;top:0}
img{display:block}
/* background */
.blob{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) 1.3px,transparent 1.6px);background-size:34px 34px;-webkit-mask:radial-gradient(ellipse 75% 65% at 50% 45%,#000 30%,transparent 80%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.grain{position:absolute;inset:0;opacity:.05}
/* type */
.cap{position:absolute}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:21px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:#a5b4fc}
.eyebrow::before{content:'';width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#e879f9);box-shadow:0 0 14px #a78bfa}
.cap h2{margin-top:20px;font-size:74px;line-height:1.03;font-weight:820;letter-spacing:-.045em}
.sub{margin-top:24px;font-size:27px;line-height:1.45;color:rgba(235,235,255,.74);font-weight:450}
.grad{background:linear-gradient(100deg,#a5b4fc 0%,#c4b5fd 45%,#f0abfc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{position:absolute;display:inline-flex;align-items:center;gap:12px;padding:13px 22px 13px 14px;border-radius:999px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.16);font-size:23px;font-weight:600;color:#ecebff;white-space:nowrap;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.chip .ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
.chip .ic svg{width:21px;height:21px}
.chip.ok .ic{background:linear-gradient(135deg,#10b981,#059669)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:54px;padding:0 14px;border-radius:12px;background:linear-gradient(#2a2a40,#1c1c2c);border:1px solid rgba(255,255,255,.18);border-bottom-width:5px;font-size:24px;font-weight:750;color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.7)}
.keyrow{position:absolute;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;color:rgba(255,255,255,.55)}
.tool{position:absolute;display:flex;align-items:center;gap:16px;font-size:25px;font-weight:650;color:rgba(255,255,255,.9)}
.tool .key{min-width:48px;height:48px;font-size:22px}
/* windows */
.win{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 50px 120px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.12)}
.win .bar{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;background:#f1f1f6;border-bottom:1px solid #e3e3ec}
.win.dark .bar{background:#16161f;border-color:#262633}
.win .bar i{width:13px;height:13px;border-radius:50%}
.win .bar i:nth-child(1){background:#ff5f57}.win .bar i:nth-child(2){background:#febc2e}.win .bar i:nth-child(3){background:#28c840}
.win .ttl{margin-left:14px;display:flex;align-items:center;gap:9px;height:28px;padding:0 14px;border-radius:8px;background:#fff;border:1px solid #e1e1ea;font-size:15px;font-weight:600;color:#55556a}
.win.dark .ttl{background:#1f1f2b;border-color:#30303f;color:#a8a8bd}
.win .ttl img{width:17px;height:17px;border-radius:4px}
.vp{position:relative;overflow:hidden;background:#fff}
.cam{position:absolute;left:0;top:0;transform-origin:0 0}
.cam>img,.cam>.ov{position:absolute;left:0;top:0}
.cursor{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.cursor svg{width:100%;height:100%;display:block}
.ring{position:absolute;left:0;top:0;border-radius:50%;border:3px solid #8b5cf6;background:rgba(139,92,246,.18)}
.hl{position:absolute;border-radius:14px;border:3px solid #a78bfa;box-shadow:0 0 0 6px rgba(167,139,250,.25),0 0 40px rgba(167,139,250,.55)}
/* browser mock */
.browser{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 50px 120px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.12)}
.bbar{height:78px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#eef0f5;border-bottom:1px solid #dfe2ea;color:#5b5f6e}
.bbar .dots{display:flex;gap:9px}.bbar .dots i{width:13px;height:13px;border-radius:50%}
.bbar .dots i:nth-child(1){background:#ff5f57}.bbar .dots i:nth-child(2){background:#febc2e}.bbar .dots i:nth-child(3){background:#28c840}
.bbar svg{width:22px;height:22px}
.addr{flex:1;height:46px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:23px;background:#fff;border:1px solid #dcdfe8;font-size:19px;color:#3b3f4c}
.addr svg{width:17px;height:17px;color:#6b7080}
.ext{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.ext img{width:28px;height:28px;border-radius:7px}
.badge{position:absolute;right:-8px;bottom:-4px;padding:1px 6px;border-radius:7px;background:#4f46e5;color:#fff;font-size:12px;font-weight:800;border:2px solid #eef0f5}
.bview{position:relative;overflow:hidden;background:#fff}
.pill{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:999px;background:rgba(15,15,30,.86);color:#fff;font-size:20px;font-weight:650;box-shadow:0 14px 34px -12px rgba(0,0,0,.6)}
.pill .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.pbar{width:150px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar>b{display:block;height:100%;background:linear-gradient(90deg,#818cf8,#e879f9);transform-origin:0 50%}
.scan{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#8b5cf6,#e879f9,transparent);box-shadow:0 0 22px 6px rgba(139,92,246,.55)}
.flash{position:absolute;inset:0;background:#fff}
/* cards */
.card{position:absolute;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px -30px rgba(0,0,0,.8);overflow:hidden}
.card .shot{position:relative;overflow:hidden;background:#fff}
.card .shot img{position:absolute;left:0;top:0}
.card h3{font-size:31px;font-weight:780;letter-spacing:-.02em;margin:24px 26px 0}
.card p{font-size:20px;line-height:1.45;color:rgba(235,235,255,.7);margin:10px 26px 0}
.card .keyrow{position:static;margin:18px 26px 0}
.card .keyrow .key{min-width:46px;height:46px;font-size:20px;border-radius:10px}
.tall{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 50px 120px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.18);background:#fff}
.tag{position:absolute;padding:9px 16px;border-radius:10px;background:rgba(15,15,30,.85);color:#fff;font-size:18px;font-weight:650}
/* recorder overlays */
.rec{position:absolute;display:flex;align-items:center;gap:16px;padding:16px 26px 16px 20px;border-radius:20px;background:#fff;color:#0b0b14;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.rec .rdot{width:18px;height:18px;border-radius:50%;background:#ef4444}
.rec b{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rec small{display:block;font-size:16px;color:#6c6c80;font-weight:600}
.eq{display:flex;align-items:center;gap:4px;height:40px}
.eq i{width:6px;height:40px;border-radius:3px;background:linear-gradient(#facc15,#22c55e 45%,#22c55e 55%,#facc15);transform-origin:center}
.feat{position:absolute;display:flex;align-items:center;gap:18px;font-size:25px;font-weight:620;color:#f1f0ff;line-height:1.3}
.feat .ic{flex:none;display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.95),rgba(168,85,247,.95));box-shadow:0 12px 26px -10px rgba(139,92,246,.8)}
.feat .ic svg{width:26px;height:26px}
.count{position:absolute;font-size:300px;font-weight:850;letter-spacing:-.06em;line-height:1}
.tile{position:absolute;display:flex;align-items:center;gap:18px;width:400px;height:104px;padding:0 26px;border-radius:22px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.14);font-size:27px;font-weight:700}
.tile .ic{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#10b981,#059669)}
.tile .ic svg{width:28px;height:28px}
.btn{position:absolute;display:inline-flex;align-items:center;gap:16px;height:84px;padding:0 42px;border-radius:24px;font-size:31px;font-weight:750;color:#fff;background:linear-gradient(135deg,#4f46e5,#6d45ec 55%,#8b3ee6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 50px -16px rgba(99,102,241,.9);overflow:hidden}
.btn svg{width:32px;height:32px}
.btn .shine{position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent)}
.toast{position:absolute;display:flex;align-items:center;gap:14px;padding:16px 24px;border-radius:16px;background:#fff;color:#0b0b14;font-size:21px;font-weight:650;box-shadow:0 24px 50px -16px rgba(0,0,0,.7)}
.toast .ic{display:flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;background:#10b981;color:#fff}
.toast .ic svg{width:20px;height:20px}
.prog{position:absolute;display:flex;align-items:center;gap:14px;padding:14px 22px;border-radius:14px;background:#1d1d2b;color:#fff;font-size:20px;font-weight:650;box-shadow:0 20px 40px -14px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
const TL = await (await fetch('timeline.json')).json();
const RAW = '../../.output/video/raw/';
const LOGO = '../../src/assets/logo.svg';
const DEV = '../../public/developer.webp';
const ICON = (name, size) => (window.ICONS?.[name] ?? '').replace('<svg', `<svg width="${size || 24}" height="${size || 24}"`);
const W = 1920, H = 1080;
const stage = document.getElementById('stage');
await document.fonts.load('850 100px Inter');
await document.fonts.load('500 30px Inter');
await document.fonts.ready;

// ── Timeline engine: every frame is a pure function of t ──
const E = {
  lin: (p) => p,
  out: (p) => 1 - (1 - p) ** 3,
  out5: (p) => 1 - (1 - p) ** 5,
  in: (p) => p ** 3,
  io: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
  sine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  back: (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; },
  expo: (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p)),
};
const nodes = [], updaters = [], scenes = [];
let cur = null;
function el(html, parent) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const e = t.content.firstElementChild;
  (parent || cur?.el || stage).appendChild(e);
  return e;
}
function N(e, base = {}) {
  const n = { e, tr: {}, base: { x: 0, y: 0, s: 1, r: 0, o: 1, ...base }, scene: cur, last: {} };
  nodes.push(n);
  return n;
}
// Keyframes accumulate: an entrance and an exit on the same property merge into one track.
function K(n, prop, keys) {
  n.tr[prop] = [...(n.tr[prop] || []), ...keys].sort((a, b) => a[0] - b[0]);
  return n;
}
function val(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1];
      const [t1, v1, e = 'io'] = keys[i];
      const p = t1 === t0 ? 1 : (t - t0) / (t1 - t0);
      return v0 + (v1 - v0) * E[e](p);
    }
  }
  return keys[keys.length - 1][1];
}
function set(n, k, v) {
  if (n.last[k] !== v) {
    n.last[k] = v;
    n.e.style[k] = v;
  }
}
function apply(n, t) {
  const p = { ...n.base };
  for (const k in n.tr) p[k] = val(n.tr[k], t);
  if (n.cam) {
    const { w, h, k } = n.cam;
    const z = p.z ?? 1;
    const fx = (p.fx ?? 1280) * k, fy = (p.fy ?? 800) * k;
    const tx = Math.min(0, Math.max(w - z * w, w / 2 - z * fx));
    const ty = Math.min(0, Math.max(h - z * h, h / 2 - z * fy));
    set(n, 'transform', `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${z.toFixed(4)})`);
    return;
  }
  set(n, 'transform', `translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px) rotate(${p.r.toFixed(3)}deg) scale(${p.s.toFixed(4)})`);
  set(n, 'opacity', String(Math.max(0, Math.min(1, p.o)).toFixed(3)));
  const f = [];
  if (p.b > 0.05) f.push(`blur(${p.b.toFixed(2)}px)`);
  if (p.br !== undefined && Math.abs(p.br - 1) > 0.001) f.push(`brightness(${p.br.toFixed(3)})`);
  set(n, 'filter', f.join(' ') || 'none');
  if (p.ct !== undefined) set(n, 'clipPath', `inset(${p.ct.toFixed(1)}px ${p.cr.toFixed(1)}px ${p.cb.toFixed(1)}px ${p.cl.toFixed(1)}px)`);
  else if (p.circ !== undefined) set(n, 'clipPath', `circle(${Math.max(0, p.circ).toFixed(1)}px at ${p.cx}px ${p.cy}px)`);
  if (p.sx !== undefined) set(n, 'transform', `translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px) scale(${p.sx.toFixed(4)},1)`);
}
function scene(name, pre = 0.4) {
  const [t0, t1] = TL.scenes[name];
  const e = el(`<div class="scene" data-s="${name}"></div>`, stage);
  const s = { name, t0, t1, v0: t0 - pre, v1: t1, el: e };
  scenes.push(s);
  cur = s;
  const n = N(e);
  K(n, 'o', [[t1 - 0.42, 1], [t1 - 0.02, 0, 'in']]);
  K(n, 's', [[t1 - 0.42, 1], [t1 - 0.02, 1.035, 'in']]);
  K(n, 'b', [[t1 - 0.42, 0], [t1 - 0.02, 6, 'in']]);
  return s;
}
const up = (fn) => updaters.push({ fn, scene: cur });

// Fade/slide in helper.
function enter(n, t, { dy = 28, dx = 0, s = 1, blur = 8, d = 0.6, ease = 'out' } = {}) {
  K(n, 'o', [[t, 0], [t + d * 0.8, 1, 'out']]);
  if (dy || dx) {
    if (dy) K(n, 'y', [[t, n.base.y + dy], [t + d, n.base.y, ease]]);
    if (dx) K(n, 'x', [[t, n.base.x + dx], [t + d, n.base.x, ease]]);
  }
  if (s !== 1) K(n, 's', [[t, s], [t + d, 1, ease]]);
  if (blur) K(n, 'b', [[t, blur], [t + d * 0.8, 0, 'out']]);
  return n;
}
function at(html, x, y, parent) {
  const e = el(html, parent);
  if (getComputedStyle(e).position === 'static') e.style.position = 'absolute';
  if (!e.style.left) e.style.left = '0';
  if (!e.style.top) e.style.top = '0';
  return N(e, { x, y });
}
function caption({ x, y, w, eyebrow, title, sub, t, align = 'left', size = 74 }) {
  const e = el(`<div class="cap" style="left:${x}px;top:${y}px;width:${w}px;text-align:${align}"><div class="eyebrow">${eyebrow}</div><h2 style="font-size:${size}px">${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div>`);
  [...e.children].forEach((c, i) => enter(N(c), t + i * 0.16, { dy: 26 }));
  return e;
}
function chip(text, x, y, t, icon = 'Check', cls = '', parent) {
  return enter(at(`<div class="chip ${cls}"><span class="ic">${ICON(icon, 21)}</span>${text}</div>`, x, y, parent), t, { dy: 18, s: 0.94, d: 0.5, ease: 'back' });
}
// Lay nodes out in a centred row, using their real widths (fonts are loaded).
function row(ns, cx = 960, gap = 24) {
  const ws = ns.map((n) => n.e.offsetWidth);
  let x = cx - (ws.reduce((a, b) => a + b, 0) + gap * (ns.length - 1)) / 2;
  ns.forEach((n, i) => { n.base.x = x; x += ws[i] + gap; });
}
function centerX(n, cx = 960) { n.base.x = cx - n.e.offsetWidth / 2; }
const keycap = (k) => `<span class="key">${k}</span>`;
function press(n, t) {
  K(n, 's', [[t - 0.05, 1], [t, 0.9, 'out'], [t + 0.16, 1, 'out']]);
}

// Window holding real captures, with a camera (zoom/pan) and a cursor inside.
function win({ x, y, w, title, layers, dark = false }) {
  const k = w / 2560, h = Math.round(1600 * k);
  const e = el(`<div class="win${dark ? ' dark' : ''}" style="left:0;top:0;width:${w}px"><div class="bar"><i></i><i></i><i></i><span class="ttl"><img src="${LOGO}" alt=""><span class="tt">${title}</span></span></div><div class="vp" style="width:${w}px;height:${h}px"><div class="cam" style="width:${w}px;height:${h}px"></div></div></div>`);
  const cam = e.querySelector('.cam');
  const camN = N(cam);
  camN.cam = { w, h, k };
  const L = {};
  layers.forEach((name, i) => (L[name] = N(el(`<img src="${RAW}${name}.png" style="width:${w}px;height:${h}px" alt="">`, cam), { o: i === 0 ? 1 : 0 })));
  const n = N(e, { x, y });
  return { e, n, cam: camN, camEl: cam, L, k, w, h, x, y, tt: e.querySelector('.tt') };
}
function swap(wn, name, t) {
  K(wn.L[name], 'o', [[t - 0.001, 0], [t, 1, 'lin']]);
}
function fade(wn, name, t, d = 0.35) {
  K(wn.L[name], 'o', [[t, 0], [t + d, 1, 'sine']]);
}
// Reveal part of the next state inside a box (raw px), like it is being drawn.
function reveal(wn, name, [x0, y0, x1, y1], t0, t1, mode, hideAt) {
  const { k, w, h } = wn;
  const n = N(el(`<img class="ov" src="${RAW}${name}.png" style="width:${w}px;height:${h}px" alt="">`, wn.camEl), { o: 1 });
  const X0 = x0 * k - 2, X1 = x1 * k + 2, Y0 = y0 * k - 2, Y1 = y1 * k + 2;
  const e = 'lin';
  if (mode === 'ltr') { K(n, 'ct', [[0, Y0]]); K(n, 'cb', [[0, h - Y1]]); K(n, 'cl', [[0, X0]]); K(n, 'cr', [[t0, w - X0], [t1, w - X1, e]]); }
  if (mode === 'rtl') { K(n, 'ct', [[0, Y0]]); K(n, 'cb', [[0, h - Y1]]); K(n, 'cr', [[0, w - X1]]); K(n, 'cl', [[t0, X1], [t1, X0, e]]); }
  if (mode === 'box') { K(n, 'ct', [[0, Y0]]); K(n, 'cl', [[0, X0]]); K(n, 'cr', [[t0, w - X0], [t1, w - X1, e]]); K(n, 'cb', [[t0, h - Y0], [t1, h - Y1, e]]); }
  K(n, 'o', [[hideAt - 0.001, 1], [hideAt, 0, 'lin']]);
  return n;
}
function pop(wn, name, cxRaw, cyRaw, r, t, hideAt) {
  const { k, w, h } = wn;
  const n = N(el(`<img class="ov" src="${RAW}${name}.png" style="width:${w}px;height:${h}px" alt="">`, wn.camEl), { o: 1, cx: cxRaw * k, cy: cyRaw * k });
  K(n, 'circ', [[t, 0], [t + 0.28, r * k, 'back']]);
  K(n, 'o', [[hideAt - 0.001, 1], [hideAt, 0, 'lin']]);
  return n;
}
const CURSOR = '<svg viewBox="0 0 24 34"><path d="M2.5 2.5v25.5l6.3-6 4.4 10.4 4.3-1.9-4.4-10.2h8.9z" fill="#0b0b14" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
// A cursor, either in stage px (parent = scene) or in raw px inside a window camera.
function cursor(parent, size, unit = 1) {
  const e = el(`<div class="cursor" style="width:${size}px;height:${size * 1.42}px">${CURSOR}</div>`, parent);
  const r = el(`<div class="ring" style="width:${size * 2.2}px;height:${size * 2.2}px;margin:${-size * 1.1}px 0 0 ${-size * 1.1}px"></div>`, parent);
  parent.appendChild(e);

// ── Seek ──
function seek(t) {
  for (const s of scenes) s.vis = t >= s.v0 && t < s.v1;
  for (const s of scenes) s.el.style.display = s.vis ? 'block' : 'none';
  for (const u of updaters) if (!u.scene || u.scene.vis) u.fn(t);
  for (const n of nodes) if (!n.scene || n.scene.vis) apply(n, t);
}
