<!doctype html><html><head><meta charset="utf-8"><title>Lazy images fixture</title>
<link rel="stylesheet" href="style.css"><style>.img { display:block; width: 400px; height: 300px; margin: 0 0 40px 0; background: rgb(240,240,240); }</style></head>
<body><div id="list"></div>
<script>
  var list = document.getElementById('list');
  for (var i = 0; i < 16; i++) {
    var img = document.createElement('img');
    img.className = 'img';
    img.width = 400; img.height = 300;
    if (i % 2 === 0) { img.loading = 'lazy'; img.src = '/img/' + i + '.svg'; }
    else { img.dataset.src = '/img/' + i + '.svg'; img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=='; }
    list.appendChild(img);
  }
  // Classic IntersectionObserver-based lazy loading.
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting && e.target.dataset.src) { e.target.src = e.target.dataset.src; delete e.target.dataset.src; io.unobserve(e.target); } });
  });
  document.querySelectorAll('img[data-src]').forEach(function (img) { io.observe(img); });
</script></body></html>
