<!doctype html><html><head><meta charset="utf-8"><title>Dynamic content fixture</title>
<link rel="stylesheet" href="style.css"><script src="bands.js"></script>
<style>.reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s, transform .8s; } .reveal.in { opacity: 1; transform: none; }</style></head>
<body><div id="clock" style="height:40px;background:rgb(240,240,240)"></div><main id="bands"></main>
<script>
  setInterval(function(){ document.getElementById('clock').textContent = new Date().toISOString(); }, 100);
  renderBands(document.getElementById('bands'), 30, 120);
  document.querySelectorAll('.band').forEach(function (b) { b.classList.add('reveal'); });
  new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); }); }).observe && document.querySelectorAll('.band').forEach(function (b) {
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); }); }).observe(b); });
</script></body></html>
