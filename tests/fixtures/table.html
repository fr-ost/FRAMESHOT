<!doctype html><html><head><meta charset="utf-8"><title>Long table fixture</title>
<link rel="stylesheet" href="style.css"><script src="bands.js"></script>
<style>
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; height: 40px; background: rgb(255,255,0); text-align: left; padding: 0 8px; }
  td { height: 39px; padding: 0 8px; border-bottom: 1px solid rgba(0,0,0,0.05); }
</style></head>
<body><table><thead><tr><th>#</th><th>Name</th><th>Value</th></tr></thead><tbody id="rows"></tbody></table>
<script>
  var tb = document.getElementById('rows');
  for (var i = 0; i < 120; i++) { var tr = document.createElement('tr'); tr.style.background = bandColor(i);
    for (var c = 0; c < 3; c++) { var td = document.createElement('td'); td.textContent = c === 0 ? i : 'Row ' + i; tr.appendChild(td); } tb.appendChild(tr); }
</script></body></html>
