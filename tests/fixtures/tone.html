<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tone fixture</title></head>
<body style="font:20px system-ui;padding:40px">
<h1>Tone fixture</h1>
<p>Plays a steady 440 Hz tone so recordings of this tab can be checked for its sound.</p>
<script>
  // A real <audio> element (what most sites use), fed by a generated WAV.
  function toneWav(seconds = 30, hz = 440) {
    const rate = 44100, n = rate * seconds, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin((2 * Math.PI * hz * i) / rate) * 0.5 * 32767, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  const audio = new Audio(toneWav());
  audio.loop = true;
  window.playTone = () => audio.play();
  audio.play().catch(() => {});
</script>
</body>
</html>
