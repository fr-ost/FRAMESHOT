<!doctype html><html><head><meta charset="utf-8"><title>Sticky header fixture</title>
<link rel="stylesheet" href="style.css"><script src="bands.js"></script>
<style>
  header { position: sticky; top: 0; height: 60px; padding-left: 300px; box-sizing: border-box; background: rgb(255,0,255); z-index: 10; }
  footer.fixed { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; padding-left: 300px; box-sizing: border-box; background: rgb(0,255,255); z-index: 10; }
  .fab { position: fixed; right: 24px; bottom: 64px; width: 48px; height: 48px; border-radius: 24px; background: rgb(0,255,255); z-index: 11; }
  .section-head { position: sticky; top: 60px; height: 30px; padding-left: 300px; box-sizing: border-box; background: rgb(255,255,0); z-index: 5; }
</style></head>
<body><header>Sticky header</header><div id="a"></div><div class="section-head">Sticky section</div><div id="b"></div>
<footer class="fixed">Fixed footer</footer><div class="fab"></div>
<script>renderBands(document.getElementById('a'), 20, 120, 0); renderBands(document.getElementById('b'), 20, 120, 20);</script></body></html>
